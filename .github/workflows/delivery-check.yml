name: Buffer delivery check
on:
  schedule:
    - cron: '15 6 * * *'
      timezone: Europe/Amsterdam
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buffer-delivery-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore previous issue fingerprint
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/efi-delivery-state
          key: delivery-observer-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: delivery-observer-
      - name: Observe Buffer delivery without publishing
        id: check
        shell: python
        run: |
          import json, os, pathlib, urllib.request
          state_dir = pathlib.Path(os.environ['RUNNER_TEMP']) / 'efi-delivery-state'
          state_dir.mkdir(exist_ok=True)
          state_file = state_dir / 'last.json'
          try:
              previous = json.loads(state_file.read_text())
          except (OSError, ValueError):
              previous = {}
          try:
              url = 'https://efi-journal-club-review-store.espierin.chatgpt.site/delivery/check'
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'EFI-Delivery-Observer/1.0'}), timeout=60) as response:
                  result = json.load(response)
              if not isinstance(result.get('needsAttention'), bool) or 'checkedAt' not in result:
                  raise ValueError('Invalid delivery response')
              attention = result['needsAttention']
              fingerprint = result.get('fingerprint') or json.dumps(result.get('issues', []), sort_keys=True)
              details = json.dumps(result.get('issues', []), ensure_ascii=True)
          except Exception as error:
              attention = True
              fingerprint = 'observer_endpoint_unavailable:' + type(error).__name__
              details = 'Delivery could not be checked. No Buffer posts were changed. ' + type(error).__name__
          new_issue = attention and fingerprint != previous.get('fingerprint')
          state_file.write_text(json.dumps({'fingerprint': fingerprint, 'needsAttention': attention}))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('new_issue=' + str(new_issue).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## EFI Buffer delivery observer\n\n')
              summary.write(('New issue requires attention.' if new_issue else 'Unchanged issue remains open.' if attention else 'No delivery issues detected.') + '\n\n')
              summary.write('```text\n' + details.replace('```','') + '\n```\n\n')
              summary.write('[Open administration](https://espierin.github.io/SC_lit/admin.html)\n\nRead-only Buffer queries. No research, review, publication, scheduling or newsletter changes.\n')
      - name: Retain fingerprint to suppress repeated failure alerts
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/efi-delivery-state
          key: delivery-observer-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Flag new delivery issues
        if: steps.check.outputs.new_issue == 'true'
        run: |
          echo '::error::New EFI delivery issue. See the workflow summary and Administration. No automatic retry or publication was performed.'
          exit 1
